# Neon Glass neofetch layout. Unset options use neofetch's built-in defaults.

print_info() {
    info "OS" distro
    info "Host" model
    info "Kernel" kernel
    info "Resolution" resolution
    info "Desktop Environment" de
    info "Theme" theme
    info "Icons" icons
    info "CPU" cpu
    info "GPU" gpu
    info "Memory" memory
    info "CPU Usage" cpu_usage
    info "Disk" disk
    info "Locale" locale
    info cols
}

kernel_shorthand="off"
distro_shorthand="off"
os_arch="on"
de_version="off"

cpu_cores="logical"
gpu_type="all"
memory_percent="on"
memory_unit="gib"

disk_show=('/')
disk_subtitle="mount"
disk_percent="on"

cpu_display="infobar"
disk_display="infobar"
bar_char_elapsed="█"
bar_char_total="░"
bar_border="on"
bar_length=15
bar_color_elapsed="7"
bar_color_total="6"

# title, @, underline, subtitle, colon, info
colors=(7 7 7 6 7 7)
bold="on"
separator=":"

color_blocks="on"
block_range=(0 15)
block_width=8
block_height=1

image_backend="ascii"
image_source="${HOME}/.config/neofetch/neon-glass.txt"
ascii_colors=(7)
ascii_bold="off"
